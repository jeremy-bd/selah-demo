                position: relative;
                overflow: hidden;

                    radial-gradient(1px 1px at 32% 80%, #ffd66b, transparent),
                    radial-gradient(1px 1px at 12% 64%, #fff, transparent),
                    radial-gradient(1.5px 1.5px at 64% 84%, #fff, transparent),
                    radial-gradient(1px 1px at 90% 40%, #fff, transparent);
                opacity: .55;
            }

            .staticrypt-page {
                position: relative; z-index: 1;
                min-height: 100%;
                display: flex; align-items: center; justify-content: center;
                padding: 24px;
            }

            .staticrypt-form {
                position: relative;
                width: 100%; max-width: 380px;
                background: rgba(255,255,255,0.06);
                border: 1px solid rgba(255,255,255,0.14);
                border-radius: 28px;
                padding: 40px 34px 34px;
                text-align: center;
                backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
                box-shadow: 0 30px 80px rgba(0,0,0,0.55);
            }

            /* 브랜드 아바타 */
            .selah-avatar {
                width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 16px;
                display: flex; align-items: center; justify-content: center; font-size: 38px;
                background: radial-gradient(circle at 50% 38%, #fff 0%, #ffdce8 52%, #b98ad6 100%);
                box-shadow: 0 0 0 3px rgba(255,255,255,0.18), 0 0 30px rgba(255,150,200,0.55);
            }

            .staticrypt-instructions { margin-bottom: 6px; }
            .staticrypt-title {
                font-size: 26px; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 8px;
            }
            .staticrypt-instructions p:last-child {
                font-size: 13.5px; line-height: 1.6; color: #b9b3d6; margin: 0; word-break: keep-all;
            }

            .staticrypt-hr {
                margin: 22px 0; border: 0; border-top: 1px solid rgba(255,255,255,0.12);
            }

            .staticrypt-password-container {
                position: relative;
                background: rgba(255,255,255,0.07);
                border: 1px solid rgba(255,255,255,0.16);
                border-radius: 14px;
                margin: 0 0 14px;
            }
            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent; border: 0; outline: 0;
                width: 100%; color: #fff; font-size: 16px; font-family: inherit;
                padding: 15px 44px 15px 16px;
            }
            .staticrypt-form input::placeholder { color: rgba(255,255,255,0.42); }

            .staticrypt-toggle-password-visibility {
                cursor: pointer; position: absolute; right: 6px; top: 50%;
                transform: translateY(-50%); width: 20px; height: 20px; padding: 12px;
                filter: invert(1); opacity: 0.55;
            }

            label.staticrypt-remember {
                display: flex; align-items: center; justify-content: center;
                margin-bottom: 18px; font-size: 13px; color: #cfc9ea; cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.3); margin-right: 10px; accent-color: #f2a93b;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                outline: 0; border: 0; width: 100%; cursor: pointer;
                padding: 16px; border-radius: 16px;
                font-size: 15px; font-weight: 800; font-family: inherit; color: #2a1405;
                background: linear-gradient(100deg, #ffd584, #f2a93b);
                box-shadow: 0 14px 36px rgba(242,169,59,0.4);
                transition: transform .16s ease, box-shadow .16s ease;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover { transform: translateY(-2px); box-shadow: 0 20px 46px rgba(242,169,59,0.55); }
            .staticrypt-form .staticrypt-decrypt-button:active { transform: translateY(0) scale(.98); }

            .selah-foot { margin-top: 18px; font-size: 11px; color: #6f6a92; letter-spacing: .02em; }

            .hidden { display: none !important; }

            .staticrypt-spinner-container { height: 100%; display: flex; align-items: center; justify-content: center; background: #07060f; }
            .staticrypt-spinner {
                display: inline-block; width: 2rem; height: 2rem;
                border: 0.25em solid #3a3360; border-right-color: transparent; border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
        </style>
